server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header Cache-Control no-cache always;
  types { include /etc/nginx/mime.types; text/turtle ttl; application/sparql-query rq; }
  location = / { if ($arg_lesson != '') { rewrite ^ /lab.html last; } try_files /index.html =404; }
  location = /lab { rewrite ^ /lab.html last; }
  location = /lab/ { rewrite ^ /lab.html last; }
  location / { try_files $uri =404; }
}
